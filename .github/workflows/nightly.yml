# Engram Nightly Workflow - Unified Stack 完整验证
#
# 功能:
#   1. 使用 docker compose 启动完整统一栈
#   2. 运行 FULL profile 集成测试（含降级测试）
#   3. 运行 verify-unified 完整验证
#   4. 门禁能力校验：缺失能力必须 fail（不能静默跳过）
#
# 触发条件:
#   - schedule: 每天 UTC 02:00（北京时间 10:00）
#   - workflow_dispatch: 手动触发
#
# 环境要求:
#   - Docker 和 Docker Compose 可用
#   - 4 个服务账号密码（使用 CI 固定值）

name: Nightly

on:
  schedule:
    # 每天 UTC 02:00 运行（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      skip_degradation:
        description: '跳过降级测试（调试用）'
        type: boolean
        default: false
      profile:
        description: '验证 Profile'
        type: choice
        options:
          - full
          - standard
          - http_only
        default: full

env:
  # 统一栈服务账号密码（CI 固定值）
  LOGBOOK_MIGRATOR_PASSWORD: ci_migrator_pwd_123
  LOGBOOK_SVC_PASSWORD: ci_svc_pwd_123
  OPENMEMORY_MIGRATOR_PASSWORD: ci_om_migrator_pwd_123
  OPENMEMORY_SVC_PASSWORD: ci_om_svc_pwd_123
  # PostgreSQL 配置
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: engram
  # Gateway 配置
  GATEWAY_PORT: 8787
  OM_PORT: 8080
  UNKNOWN_ACTOR_POLICY: auto_create

jobs:
  # ============================================================================
  # Unified Stack 完整验证
  # ============================================================================
  unified-stack-full:
    name: Unified Stack Full Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full,dev]"

      # ----------------------------------------------------------------
      # Gate Contract 能力检测
      # 在启动服务前，先检测当前环境的能力
      # ----------------------------------------------------------------
      - name: Detect environment capabilities
        id: detect-caps
        run: |
          echo "=== 环境能力检测 ==="
          python -m scripts.unified_stack_gate_contract detect-capabilities --json > caps.json || \
            python scripts/unified_stack_gate_contract.py detect-capabilities --json > caps.json
          cat caps.json
          echo ""
          echo "capabilities_json<<EOF" >> $GITHUB_OUTPUT
          cat caps.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------------
      # Gate Contract Profile 校验（FULL profile）
      # 检查 FULL profile 是否可执行，缺失能力必须在此处 fail
      # ----------------------------------------------------------------
      - name: Validate gate contract (full profile)
        id: validate-profile
        env:
          GATE_PROFILE: full
          POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/engram
          OPENMEMORY_BASE_URL: http://localhost:8080
          SKIP_DEGRADATION_TEST: ${{ inputs.skip_degradation && '1' || '0' }}
        run: |
          echo "=== Gate Contract 校验（FULL profile）==="
          echo ""
          echo "校验策略："
          echo "  - FULL 模式下，必需能力缺失会导致 CI fail"
          echo "  - 包括：docker_available, can_stop_openmemory (配置检查)"
          echo "  - 包括：db_access_available, postgres_dsn_present"
          echo "  - 注意：docker_daemon_ok 在运行时验证（启动 docker 后）"
          echo ""
          
          # 确定 profile
          PROFILE="${{ inputs.profile || 'full' }}"
          echo "使用 Profile: $PROFILE"
          
          # 运行校验
          VALIDATE_CMD="python -m scripts.unified_stack_gate_contract validate-profile"
          if ! $VALIDATE_CMD "$PROFILE" --json > validate.json 2>&1; then
            # 回退到直接调用
            python scripts/unified_stack_gate_contract.py validate-profile "$PROFILE" --json > validate.json 2>&1 || true
          fi

          # 检查结果
          if [ -f validate.json ] && grep -q '"valid": true' validate.json 2>/dev/null; then
            echo "profile_valid=true" >> $GITHUB_OUTPUT
            cat validate.json
          else
            echo "profile_valid=false" >> $GITHUB_OUTPUT
            cat validate.json 2>/dev/null || echo '{"valid": false, "error": "validation failed"}'
            echo ""
            echo "=========================================="
            echo "[FAIL] Gate Contract 校验失败"
            echo "=========================================="
            echo ""
            echo "FULL profile 要求的能力未满足。"
            echo "请检查 CI 环境配置或降级到 standard/http_only profile。"
            echo ""
            # FULL profile 校验失败必须阻断
            if [ "$PROFILE" = "full" ]; then
              exit 1
            fi
          fi

      # ----------------------------------------------------------------
      # 启动 Docker Compose 统一栈
      # ----------------------------------------------------------------
      - name: Build OpenMemory base image (nightly)
        timeout-minutes: 12
        env:
          OPENMEMORY_UPSTREAM_REPO: https://github.com/CaviraOSS/OpenMemory.git
          OPENMEMORY_UPSTREAM_REF: v1.2.3
          OPENMEMORY_LOCAL_IMAGE: engram/openmemory:nightly
        run: |
          echo "=== 准备 OpenMemory 镜像 ==="
          echo "来源: ${OPENMEMORY_UPSTREAM_REPO}#${OPENMEMORY_UPSTREAM_REF}:backend"
          echo "本地标签: ${OPENMEMORY_LOCAL_IMAGE}"

          # 统一栈 compose 使用该变量解析 openmemory 镜像
          echo "OPENMEMORY_IMAGE=${OPENMEMORY_LOCAL_IMAGE}" >> "$GITHUB_ENV"
          # Nightly 使用 migrator 身份运行 OpenMemory，避免上游镜像启动期 DDL 触发 owner 权限错误
          echo "OM_PG_USER=openmemory_migrator_login" >> "$GITHUB_ENV"
          echo "OM_PG_PASSWORD=${OPENMEMORY_MIGRATOR_PASSWORD}" >> "$GITHUB_ENV"
          echo "OM_PG_SET_ROLE=openmemory_migrator" >> "$GITHUB_ENV"
          echo "OM_PG_AUTO_DDL=true" >> "$GITHUB_ENV"

          BUILD_CONTEXT="${OPENMEMORY_UPSTREAM_REPO}#${OPENMEMORY_UPSTREAM_REF}:backend"

          for attempt in 1 2 3; do
            echo "构建尝试 $attempt/3..."
            if docker build --pull -t "${OPENMEMORY_LOCAL_IMAGE}" "${BUILD_CONTEXT}"; then
              echo "✓ OpenMemory 镜像构建成功"
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "[FAIL] OpenMemory 镜像构建失败"
              exit 1
            fi

            echo "等待 10 秒后重试..."
            sleep 10
          done

          docker image inspect "${OPENMEMORY_LOCAL_IMAGE}" --format 'IMAGE={{.RepoTags}}'

      - name: Start unified stack with Docker Compose
        timeout-minutes: 10
        run: |
          echo "=== 启动 Unified Stack ==="
          echo ""
          echo "使用 docker-compose.unified.yml 配置"
          echo "服务账号密码已通过环境变量设置"
          echo "OPENMEMORY_IMAGE=${OPENMEMORY_IMAGE:-<unset>}"
          echo ""

          # 预拉取镜像（带重试）
          echo "预拉取 Docker 镜像..."
          for attempt in 1 2 3; do
            echo "  尝试 $attempt/3..."
            pull_output="$(docker compose -f docker-compose.unified.yml pull --ignore-buildable --quiet 2>&1)"
            pull_status=$?
            echo "$pull_output" | head -20

            if [ "$pull_status" -eq 0 ]; then
              echo "  ✓ 镜像拉取完成"
              break
            fi
            if [ $attempt -eq 3 ]; then
              echo "  ⚠ 镜像拉取失败，继续尝试启动..."
            else
              echo "  等待 5 秒后重试..."
              sleep 5
            fi
          done

          # 启动服务
          echo ""
          echo "启动服务..."
          docker compose -f docker-compose.unified.yml up -d --build

          # 显示初始状态
          echo ""
          echo "服务初始状态:"
          docker compose -f docker-compose.unified.yml ps

      - name: Wait for services to be healthy
        timeout-minutes: 5
        run: |
          echo "=== 等待服务健康 ==="

          # 通用健康检查函数
          check_health() {
            local name=$1
            local url=$2
            local max_attempts=${3:-30}
            local initial_delay=${4:-2}

            echo "等待 $name..."
            sleep $initial_delay

            for i in $(seq 1 $max_attempts); do
              if curl -sf --max-time 5 "$url" > /dev/null 2>&1; then
                echo "  ✓ $name 就绪 ($i/$max_attempts)"
                return 0
              fi

              if [ $i -eq $max_attempts ]; then
                echo "  ✗ $name 健康检查失败 (已尝试 $max_attempts 次)"
                return 1
              fi

              # 指数退避，最大 5 秒
              local backoff=$((2 + i / 5))
              [ $backoff -gt 5 ] && backoff=5
              echo "  等待中... ($i/$max_attempts, ${backoff}s)"
              sleep $backoff
            done
          }

          # 等待 Docker Compose 服务完全启动
          echo "等待 Docker Compose 服务启动..."
          sleep 5

          # 等待 PostgreSQL（使用 Docker healthcheck）
          echo "等待 PostgreSQL..."
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.unified.yml exec -T postgres pg_isready -U postgres -h localhost > /dev/null 2>&1; then
              echo "  ✓ PostgreSQL 就绪 ($i/30)"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "  ✗ PostgreSQL 未就绪"
              docker compose -f docker-compose.unified.yml logs postgres --tail=50
              exit 1
            fi
            sleep 2
          done

          # 等待 Gateway
          if ! check_health "Gateway" "http://localhost:${{ env.GATEWAY_PORT }}/health" 30 3; then
            echo "Gateway 日志:"
            docker compose -f docker-compose.unified.yml logs gateway --tail=50 || true
            exit 1
          fi

          # 等待 OpenMemory
          if ! check_health "OpenMemory" "http://localhost:${{ env.OM_PORT }}/health" 30 3; then
            echo "OpenMemory 日志:"
            docker compose -f docker-compose.unified.yml logs openmemory --tail=50 || true
            exit 1
          fi

          echo ""
          echo "✓ 所有服务就绪"

      # ----------------------------------------------------------------
      # 运行 Gateway 集成测试（FULL profile）
      # ----------------------------------------------------------------
      - name: Run Gateway integration tests (full profile)
        env:
          POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/engram
          TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/engram
          TEST_PG_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          PROJECT_KEY: test
          GATEWAY_URL: http://localhost:${{ env.GATEWAY_PORT }}
          OPENMEMORY_BASE_URL: http://localhost:${{ env.OM_PORT }}
          GATE_PROFILE: ${{ inputs.profile || 'full' }}
          RUN_INTEGRATION_TESTS: "1"
          SKIP_DEGRADATION_TEST: ${{ inputs.skip_degradation && '1' || '0' }}
        run: |
          echo "=== Gateway 集成测试（FULL profile）==="
          echo ""
          echo "环境变量："
          echo "  GATE_PROFILE=$GATE_PROFILE"
          echo "  RUN_INTEGRATION_TESTS=$RUN_INTEGRATION_TESTS"
          echo "  SKIP_DEGRADATION_TEST=$SKIP_DEGRADATION_TEST"
          echo ""

          # 统一栈集成测试期望 team:* 路径，预置 governance.settings 为团队写入开启
          docker compose -f docker-compose.unified.yml exec -T postgres \
            psql -U postgres -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO governance.settings (project_key, team_write_enabled, policy_json, updated_at)
          VALUES ('test', true, '{}'::jsonb, now())
          ON CONFLICT (project_key) DO UPDATE
          SET team_write_enabled = EXCLUDED.team_write_enabled,
              policy_json = EXCLUDED.policy_json,
              updated_at = now();
          SQL
          
          # 运行 unified stack 集成测试
          pytest tests/gateway/test_unified_stack_integration.py -v \
            --junitxml=test-unified-stack-results.xml

      # ----------------------------------------------------------------
      # 运行 Unified Stack 完整验证
      # ----------------------------------------------------------------
      - name: Run unified stack verification (full)
        timeout-minutes: 10
        env:
          GATEWAY_URL: http://localhost:${{ env.GATEWAY_PORT }}
          OPENMEMORY_BASE_URL: http://localhost:${{ env.OM_PORT }}
          POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/engram
          GATE_PROFILE: ${{ inputs.profile || 'full' }}
          VERIFY_FULL: "1"
          SKIP_DEGRADATION_TEST: ${{ inputs.skip_degradation && '1' || '0' }}
        run: |
          echo "=== Unified Stack 完整验证 ==="
          echo ""

          # 创建输出目录
          mkdir -p .artifacts

          # 运行验证（优先使用 python -m，失败时回退）
          if ! python -m scripts.verify_unified_stack \
            --profile "$GATE_PROFILE" \
            --json-out .artifacts/verify-results.json \
            --self-check \
            --verbose 2>&1; then
            echo ""
            echo "[WARN] python -m 方式失败，尝试直接调用..."
            python scripts/verify_unified_stack.py \
              --profile "$GATE_PROFILE" \
              --json-out .artifacts/verify-results.json \
              --self-check \
              --verbose || true
          fi

          # 显示结果
          if [ -f .artifacts/verify-results.json ]; then
            echo ""
            echo "=== 验证结果 ==="
            cat .artifacts/verify-results.json
          else
            echo ""
            echo "[WARN] 验证结果文件未生成"
          fi

      # ----------------------------------------------------------------
      # 运行 make verify-unified（完整模式）
      # ----------------------------------------------------------------
      - name: Run make verify-unified (full mode)
        env:
          GATEWAY_URL: http://localhost:${{ env.GATEWAY_PORT }}
          OPENMEMORY_URL: http://localhost:${{ env.OM_PORT }}
          POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/engram
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engram
          VERIFY_FULL: "1"
        run: |
          echo "=== make verify-unified（完整模式）==="
          make verify-unified

      # ----------------------------------------------------------------
      # 清理
      # ----------------------------------------------------------------
      - name: Collect diagnostic logs
        if: failure()
        run: |
          echo "=== 收集诊断日志 ==="
          mkdir -p .artifacts/diagnostics

          # 收集各服务日志
          for service in postgres gateway openmemory bootstrap_roles logbook_migrate; do
            echo "收集 $service 日志..."
            docker compose -f docker-compose.unified.yml logs "$service" --tail=200 > ".artifacts/diagnostics/${service}-logs.txt" 2>&1 || true
          done

          # 收集容器状态
          echo "收集容器状态..."
          docker compose -f docker-compose.unified.yml ps > .artifacts/diagnostics/container-status.txt 2>&1 || true
          docker ps -a >> .artifacts/diagnostics/container-status.txt 2>&1 || true

          # 收集网络信息
          echo "收集网络信息..."
          docker network ls > .artifacts/diagnostics/network-info.txt 2>&1 || true
          docker compose -f docker-compose.unified.yml config > .artifacts/diagnostics/compose-config.txt 2>&1 || true

          # 收集环境信息（脱敏）
          echo "收集环境变量信息（脱敏）..."
          env | grep -E '^(POSTGRES|GATEWAY|OM_|GATE_|VERIFY_|SKIP_)' | sed 's/=.*$/=***/' > .artifacts/diagnostics/env-info.txt 2>&1 || true

          echo "✓ 诊断日志已收集到 .artifacts/diagnostics/"

      - name: Stop unified stack
        if: always()
        run: |
          echo "=== 停止 Unified Stack ==="

          # 先保存完整日志
          docker compose -f docker-compose.unified.yml logs > compose-logs.txt 2>&1 || true

          # 停止服务
          docker compose -f docker-compose.unified.yml down -v || true

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-diagnostics-${{ github.run_id }}
          path: .artifacts/diagnostics/
          retention-days: 7
          if-no-files-found: ignore

      # ----------------------------------------------------------------
      # 记录 Acceptance Run（用于审计和可复现性）
      # ----------------------------------------------------------------
      - name: Record acceptance run
        if: always()
        env:
          GATE_PROFILE: ${{ inputs.profile || 'full' }}
        run: |
          echo "=== 记录 Acceptance Run ==="

          # 确定 result
          if [ "${{ job.status }}" = "success" ]; then
            RESULT="PASS"
          else
            RESULT="FAIL"
          fi

          # 确定 triggered_by
          TRIGGERED_BY="${{ github.event_name }}"

          # 记录 acceptance run（优先使用 python -m）
          python -m scripts.acceptance.record_acceptance_run \
            --name nightly-unified-stack-full \
            --artifacts-dir .artifacts \
            --result "$RESULT" \
            --commit "${{ github.sha }}" \
            --command "nightly.yml unified-stack-full" \
            --metadata-kv workflow=nightly \
            --metadata-kv profile="$GATE_PROFILE" \
            --metadata-kv triggered_by="$TRIGGERED_BY" \
            --metadata-kv run_id="${{ github.run_id }}" \
            --metadata-kv sha="${{ github.sha }}" || \
          python scripts/acceptance/record_acceptance_run.py \
            --name nightly-unified-stack-full \
            --artifacts-dir .artifacts \
            --result "$RESULT" \
            --commit "${{ github.sha }}" \
            --command "nightly.yml unified-stack-full" \
            --metadata-kv workflow=nightly \
            --metadata-kv profile="$GATE_PROFILE" \
            --metadata-kv triggered_by="$TRIGGERED_BY" \
            --metadata-kv run_id="${{ github.run_id }}" \
            --metadata-kv sha="${{ github.sha }}" || true

      - name: Render acceptance matrix
        if: always()
        run: |
          echo "=== 渲染 Acceptance Matrix ==="
          python -m scripts.acceptance.render_acceptance_matrix \
            --output-dir .artifacts \
            --runs-dir .artifacts/acceptance-runs || \
          python scripts/acceptance/render_acceptance_matrix.py \
            --output-dir .artifacts \
            --runs-dir .artifacts/acceptance-runs || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-unified-stack-results-${{ github.run_id }}
          path: |
            test-unified-stack-results.xml
            .artifacts/**/*.json
            .artifacts/**/*.md
            caps.json
            validate.json
            compose-logs.txt
          retention-days: 30
          if-no-files-found: warn

  # ============================================================================
  # 迭代文档审计（轻量级 job）
  # ============================================================================
  iteration-audit:
    name: Iteration Docs Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run iteration-audit
        run: |
          echo "=== 迭代文档审计 ==="
          echo ""
          make iteration-audit
          echo ""
          echo "审计报告已生成到 .artifacts/iteration-audit/"

      - name: Upload iteration audit report
        uses: actions/upload-artifact@v4
        with:
          name: iteration-audit-${{ github.run_number }}-${{ github.run_id }}
          path: .artifacts/iteration-audit/
          retention-days: 90
          if-no-files-found: warn

  # ============================================================================
  # Nightly 汇总通知
  # ============================================================================
  notify-results:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [unified-stack-full, iteration-audit]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "=== Nightly 运行结果 ==="
          echo ""
          echo "unified-stack-full: ${{ needs.unified-stack-full.result }}"
          echo "iteration-audit: ${{ needs.iteration-audit.result }}"
          echo ""

          # 初始化状态
          HAS_FAILURE=0

          # unified-stack-full 失败时整体 fail
          if [ "${{ needs.unified-stack-full.result }}" = "failure" ]; then
            echo "=========================================="
            echo "[FAIL] unified-stack-full 验证失败"
            echo "=========================================="
            echo ""
            echo "请检查 unified-stack-full job 的日志"
            HAS_FAILURE=1
          elif [ "${{ needs.unified-stack-full.result }}" = "cancelled" ]; then
            echo "=========================================="
            echo "[CANCELLED] unified-stack-full 被取消"
            echo "=========================================="
            echo ""
            HAS_FAILURE=1
          elif [ "${{ needs.unified-stack-full.result }}" = "skipped" ]; then
            echo "=========================================="
            echo "[SKIP] unified-stack-full 被跳过"
            echo "=========================================="
            echo ""
            HAS_FAILURE=1
          fi

          # iteration-audit 失败仅警告（非阻断）
          if [ "${{ needs.iteration-audit.result }}" = "failure" ]; then
            echo "=========================================="
            echo "[WARN] 迭代文档审计发现问题"
            echo "=========================================="
            echo ""
            echo "请检查 iteration-audit job 的日志和 artifacts"
            echo "注意: 审计问题不阻断 Nightly 流水线"
          elif [ "${{ needs.iteration-audit.result }}" = "cancelled" ]; then
            echo "[INFO] iteration-audit 被取消（非阻断）"
          fi

          # 最终判定
          if [ "$HAS_FAILURE" = "1" ]; then
            echo ""
            echo "=========================================="
            echo "[FAIL] Nightly 验证失败"
            echo "=========================================="
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "[PASS] Nightly 验证通过"
          echo "=========================================="
